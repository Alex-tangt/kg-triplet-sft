# Full-scale Round-1 SFT: Qwen3-0.6B on the 2575-passage GraphRAG labels.
# LLaMA-Factory on Kaggle T4. Hyperparameters are byte-identical to the tracer
# config (and to the locked Round-1 values) — only the dataset and output_dir
# differ from finetune/qwen3_0.6b_graphrag_tracer.yaml.
#
# cutoff_len stays 6144: full-scale labels are ~2-6k tokens of JSON output
# (p99 packed ~4.9k tokens); the ~4 longest passages out of 2575 slightly
# exceed the cutoff and their tails are simply unlabelled, which is harmless.

model_name_or_path: Qwen/Qwen3-0.6B
template: qwen
stage: sft
finetuning_type: lora
dataset: graphrag_full
cutoff_len: 6144

per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true

lora_rank: 32
lora_alpha: 32
lora_dropout: 0.1
target_modules: all

logging_steps: 5
save_steps: 200
output_dir: saves/qwen3-0.6b-graphrag-full
overwrite_output_dir: true
